context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "CleanMic"
            media.name       = "CleanMic"
            audio.position   = [ MONO ]
            # Standalone denoised mic for every app: RNNoise -> limiter
            # in ONE node (no extra source, no background process,
            # suspends at idle). Control keys are LADSPA port names.
            filter.graph = {
                nodes = [
                    { type = ladspa name = rn
                      plugin = "cleanmic-dsp"
                      label = cleanmic_rnnoise
                      control = { "vad_threshold" = 50.0 } }
                    { type = ladspa name = lim
                      plugin = "cleanmic-dsp"
                      label = cleanmic_limiter
                      control = { "ceiling_db" = -3.0 } }
                ]
                links = [
                    { output = "rn:Output" input = "lim:Input" }
                ]
            }
            capture.props = {
                node.name   = "effect_input.cleanmic"
                node.target = "alsa_input.pci-0000_00_1f.3.analog-stereo"
                node.passive = true
            }
            playback.props = {
                node.name   = "CleanMic"
                media.class = Audio/Source
            }
        }
    }
]
